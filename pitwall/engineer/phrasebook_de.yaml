  plan_b_text:
    - "Plan B: {plan_b}."
  window_open:
    - "Boxenfenster ist offen. Runde {lo} bis {hi}."
    - "Fenster offen, Runde {lo} bis {hi}. Wir sagen dir Bescheid."
  window_soon:
    - "Box in etwa {laps}. Plan bleibt {compound}."
  box_this_lap:
    - "Box diese Runde, Box diese Runde. {compound}."
    - "Box, Box. Diese Runde rein, {compound}."
  box_now:
    - "Box, Box, Box!"
  box_under_sc:
    - "Safety Car! Box, Box, diese Runde. Wir gewinnen {gain}. {compound}."
    - "Box diese Runde unter Safety Car, {compound}. Das spart {gain}."
  stay_out_sc:
    - "Safety Car. Wir bleiben draußen, Stopp lohnt sich nicht."
  plan_change:
    - "Planänderung. Wir gehen auf {plan}."
    - "Neuer Plan: {plan}."
  plan_a_plus:
    - "Reifen halten gut. Plan A plus {laps}."
    - "Die Reifen machen mit, wir verlängern. Plan A plus {laps}."
  plan_earlier:
    - "Reifen bauen schneller ab. Wir ziehen den Stopp vor, Runde {lap}."
  rival_pitted_behind:
    - "{name} hinter dir ist in der Box. Undercut-Gefahr. Push jetzt."
    - "{name} ist rein, Undercut-Versuch. Gib alles diese Runde."
  rival_pitted_ahead:
    - "{name} vor dir ist in der Box. Freie Fahrt, push."
    - "{name} hat gestoppt. Jetzt Rundenzeiten fahren."
  undercut_chance:
    - "Undercut auf {name} ist möglich, {gap} Rückstand. Wir überlegen."
  rejoin:
    - "Nach dem Stopp kommst du als {pos} raus{traffic}."
  rejoin_traffic: [", direkt hinter {name}"]
  rivals_to_stop:
    - "{n} Autos vor dir müssen noch stoppen."
  teammate_in_pit:
    - "Achtung, Teamkollege ist gerade in der Box. Rechne mit Wartezeit."
