# PIT WALL – deutsches Phrasebook
# Stil: echter Boxenfunk. Kurz, Zahlen zuerst, kein Smalltalk in kritischen Phasen.
# Platzhalter werden doppelt gefüllt (Anzeige mit Ziffern, Sprache als Wörter).
# Mehrere Varianten pro Schlüssel; der Engineer wiederholt nie zweimal dieselbe.

race:
  grid: ["Okay, Startaufstellung. Kupplung bereit, auf die Ampel konzentrieren."]
  lights_out:
    - "Ampel aus, los geht's!"
    - "Und los! Sauber durch Kurve eins."
    - "Lights out. Pass auf in Kurve eins."
  start_gained:
    - "Starker Start. {n} Plätze gewonnen, du bist {pos}."
    - "Sehr gut, plus {n}. {pos}."
  start_lost:
    - "{n} Plätze verloren am Start, {pos}. Ruhig bleiben, das Rennen ist lang."
    - "{pos}, minus {n}. Kopf runter, wir holen das zurück."
  start_held:
    - "Position gehalten, {pos}. Gut gemacht."
    - "{pos} nach Runde eins. Sauber."
  overtook:
    - "Gut gemacht, {pos}. {name} ist hinter dir."
    - "Stark. {pos}."
    - "Schöner Move. {pos} jetzt."
  overtaken:
    - "{name} ist vorbei, {pos}."
    - "{pos}, {name} hat dich. Dranbleiben."
  laps_to_go:
    - "Noch {laps}."
    - "{laps} to go."
  last_lap:
    - "Letzte Runde. {pos}. Bring ihn nach Hause."
    - "Weiße Flagge, letzte Runde. Keine Risiken, {pos}."
  finished:
    - "Zielflagge! {pos}. {summary}"
    - "Das war's, {pos}. {summary}"
  finished_win:
    - "Zielflagge! Du hast gewonnen! Was für ein Rennen! {summary}"
  finished_podium:
    - "Zielflagge, {pos}! Podium! Starke Leistung. {summary}"
  retired:
    - "Okay, das war's leider. Box, Auto abstellen."

gap:
  ahead:
    - "{gap} auf {name}."
    - "Abstand nach vorne {gap}, {name}."
  ahead_closing:
    - "{gap} auf {name}, du holst {delta} pro Runde."
    - "{gap} nach vorne, {name}. Holst {delta} pro Runde."
  drs_soon:
    - "{gap} auf {name}. In {laps} in DRS-Reichweite."
    - "{name} {gap} vor dir. So weiter, DRS in etwa {laps}."
  in_drs:
    - "Du bist im DRS-Fenster von {name}."
    - "{gap} auf {name}, DRS ist da. Angriff."
  close_ahead_gt:
    - "{gap} auf {name}. Du bist dran, bau Druck auf."
  behind_closing:
    - "{name} kommt näher. {gap} hinter dir, er holt {delta} pro Runde."
    - "Achtung, {name} {gap} hinter dir, macht {delta} pro Runde gut."
  behind_drs:
    - "{name} ist in deinem DRS-Fenster. Verteidigen."
    - "{name} {gap} hinter dir, im DRS. Saubere Ausgänge."
  behind_close_gt:
    - "{name} direkt hinter dir, {gap}. Innenbahn zumachen."
  pulling_away:
    - "Du fährst weg. {gap} auf {name}, plus {delta} pro Runde."
  stable:
    - "Abstand stabil. {gap} nach vorne, {gap_behind} nach hinten."
  ahead_tyre_offset:
    - "{gap} auf {name}. Seine Reifen sind {laps} älter."
  behind_tyre_offset:
    - "{name} {gap} hinter dir, seine Reifen sind {laps} frischer."

strategy:
