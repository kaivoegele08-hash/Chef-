    - "Sauberer Stopp. Reifen kalt, vorsichtig in Kurve eins."
    - "Guter Stopp. Out-Lap, Reifen aufwärmen."
  pit_exit_position:
    - "Du bist {pos} nach dem Stopp. {name} {gap} vor dir."
  pit_limiter:
    - "Limiter! Limiter!"
  mandatory_stop_open:
    - "Pflichtstopp noch offen."

fuel:
  ok:
    - "Sprit passt bis ins Ziel. {surplus} Runden Reserve."
    - "Sprit ist gut. Plus {surplus} Runden."
  critical:
