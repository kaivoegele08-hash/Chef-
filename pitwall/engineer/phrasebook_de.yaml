    - "Wir müssen Sprit sparen. {deficit} Runden zu wenig, Ziel {target} pro Runde."
  save:
    - "Bitte Sprit sparen, Ziel {target} pro Runde. Lift and Coast, etwa {lift} vor den großen Bremszonen."
    - "Sprit sparen. {target} pro Runde. Früher vom Gas, rund {lift}."
  save_done:
    - "Sprit passt wieder. Normal fahren."
  surplus:
    - "Wir haben {surplus} Runden Sprit extra. Du kannst pushen."
  laps_in_tank:
    - "Sprit für {laps} im Tank."
  refuel:
    - "Beim Stopp brauchen wir {litres}."
  empty:
    - "Sprit fast leer! Box diese Runde!"
  empty_no_refuel:
    - "Sprit fast leer! Maximal sparen, früh vom Gas, kurz schalten."

tyres:
