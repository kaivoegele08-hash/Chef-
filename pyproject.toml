[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "pitwall"
version = "0.1.0"
description = "PIT WALL – KI-Renningenieur für mehrere Rennsimulationen (Live-Telemetrie, Funk, Strategie, Coaching)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "PIT WALL contributors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Games/Entertainment :: Simulation",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Claude als Gehirn (ohne: Phrasebook-Modus)
llm = ["anthropic>=0.70"]
# Audio-Ausgabe + Mikrofon (PipeWire/PulseAudio/WASAPI über PortAudio)
audio = ["sounddevice>=0.4.6"]
# Lokale Spracherkennung
stt = ["faster-whisper>=1.0"]
# Lokale Sprachausgabe (Piper, GPL-3 – wird nur als optionale Laufzeit-Abhängigkeit genutzt)
tts = ["piper-tts>=1.2"]
# Lenkradtasten
ptt-linux = ["evdev>=1.7; sys_platform == 'linux'"]
ptt-sdl = ["pygame>=2.5"]
# Schnellere Salsa20-Entschlüsselung für GT7 (sonst reine Python-Implementierung)
fast = ["pycryptodome>=3.20", "zstandard>=0.22"]
all = [
    "pitwall[llm,audio,stt,tts,ptt-sdl,fast]",
    "evdev>=1.7; sys_platform == 'linux'",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
pitwall = "pitwall.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["pitwall"]

[tool.hatch.build.targets.wheel.force-include]
"config" = "pitwall/_config"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning:websockets.*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "SIM108", "B008", "RUF046", "SIM105", "SIM115", "ASYNC109",
          "ASYNC240", "B027"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E741", "SIM118", "RUF059", "ASYNC220"]
# läuft im Python 3.3 von Assetto Corsa
"pitwall/bridge/ac_app/*" = ["UP", "RUF"]

[tool.mypy]
exclude = ["pitwall/bridge/ac_app/"]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
